<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掼蛋语音记牌功能测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .voice-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .voice-button {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .voice-button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .voice-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .voice-button.listening {
            background: #ff4757;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status.idle { background: #e8f5e8; color: #2e7d32; }
        .status.listening { background: #fff3e0; color: #f57c00; }
        .status.processing { background: #e3f2fd; color: #1976d2; }
        .status.success { background: #e8f5e8; color: #2e7d32; }
        .status.error { background: #ffebee; color: #c62828; }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #007bff;
        }

        .result-panel h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .result-content {
            background: white;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 200px;
        }

        .command-examples {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .command-examples h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .example-group {
            background: white;
            border-radius: 8px;
            padding: 15px;
        }

        .example-group h4 {
            color: #007bff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .example-item {
            background: #f1f3f4;
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .test-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .test-button {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .test-button:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757 0%, #ffa726 50%, #4CAF50 100%);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
            
            .voice-control {
                flex-direction: column;
            }
            
            .examples-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 掼蛋语音记牌测试</h1>
            <p>测试语音识别和指令解析功能</p>
        </div>

        <div class="voice-control">
            <button id="startBtn" class="voice-button">🎤 开始录音</button>
            <button id="stopBtn" class="voice-button" disabled>⏹️ 停止录音</button>
            <button id="clearBtn" class="test-button">🗑️ 清空结果</button>
        </div>

        <div id="status" class="status idle">
            准备就绪 - 点击开始录音进行测试
        </div>

        <div class="results">
            <div class="result-panel">
                <h3>🔊 语音识别结果</h3>
                <div id="voiceResult" class="result-content">等待语音输入...</div>
                <div class="confidence-bar">
                    <div id="confidenceBar" class="confidence-fill" style="width: 0%"></div>
                </div>
            </div>

            <div class="result-panel">
                <h3>🧠 指令解析结果</h3>
                <div id="parseResult" class="result-content">等待解析结果...</div>
            </div>
        </div>

        <div class="command-examples">
            <h3>📝 指令示例</h3>
            <div class="examples-grid" id="examples">
                <!-- 示例将由JavaScript动态填充 -->
            </div>
        </div>

        <div class="test-controls">
            <button class="test-button" onclick="testCommand('我单K')">测试: 我单K</button>
            <button class="test-button" onclick="testCommand('上对10')">测试: 上对10</button>
            <button class="test-button" onclick="testCommand('对三A带5')">测试: 对三A带5</button>
            <button class="test-button" onclick="testCommand('下顺5五张')">测试: 下顺5五张</button>
            <button class="test-button" onclick="testCommand('我炸8')">测试: 我炸8</button>
            <button class="test-button" onclick="testCommand('上过')">测试: 上过</button>
        </div>
    </div>

    <script type="module">
        import { VoiceRecognitionService } from '../services/VoiceRecognitionService.js';
        import { CommandParser } from '../parsers/CommandParser.js';

        class VoiceTestApp {
            constructor() {
                this.voiceService = null;
                this.commandParser = null;
                this.initializeServices();
                this.bindEvents();
                this.initializeUI();
            }

            initializeServices() {
                // 检查浏览器支持
                if (!VoiceRecognitionService.isSupported()) {
                    this.updateStatus('error', '浏览器不支持语音识别功能');
                    return;
                }

                // 初始化语音识别服务
                this.voiceService = new VoiceRecognitionService();
                
                // 初始化指令解析器
                this.commandParser = new CommandParser(this.voiceService.getConfig());

                // 注册事件监听器
                this.voiceService.on('onStateChange', (state) => {
                    this.updateStatus(state, this.getStateMessage(state));
                    this.updateButtonStates(state);
                });

                this.voiceService.on('onResult', (result) => {
                    this.displayVoiceResult(result);
                    this.parseCommand(result.text);
                });

                this.voiceService.on('onError', (error) => {
                    this.updateStatus('error', error.message);
                    this.displayError(error);
                });
            }

            bindEvents() {
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.startListening();
                });

                document.getElementById('stopBtn').addEventListener('click', () => {
                    this.stopListening();
                });

                document.getElementById('clearBtn').addEventListener('click', () => {
                    this.clearResults();
                });
            }

            initializeUI() {
                this.displayCommandExamples();
            }

            startListening() {
                if (this.voiceService) {
                    this.voiceService.startListening();
                }
            }

            stopListening() {
                if (this.voiceService) {
                    this.voiceService.stopListening();
                }
            }

            parseCommand(text) {
                if (!this.commandParser) return;

                try {
                    const command = this.commandParser.parse(text);
                    this.displayParseResult(command, text);
                } catch (error) {
                    this.displayParseError(error, text);
                }
            }

            displayVoiceResult(result) {
                const element = document.getElementById('voiceResult');
                const confidence = Math.round(result.confidence * 100);
                
                let content = `识别文本: ${result.text}\n`;
                content += `置信度: ${confidence}%\n`;
                
                if (result.alternatives && result.alternatives.length > 0) {
                    content += `备选结果: ${result.alternatives.join(', ')}\n`;
                }
                
                content += `时间: ${new Date().toLocaleTimeString()}`;
                
                element.textContent = content;
                
                // 更新置信度条
                document.getElementById('confidenceBar').style.width = confidence + '%';
            }

            displayParseResult(command, originalText) {
                const element = document.getElementById('parseResult');
                
                if (command) {
                    const validation = this.commandParser.validateCommand(command);
                    
                    let content = `✅ 解析成功\n\n`;
                    content += `原文: ${originalText}\n`;
                    content += `玩家: ${this.getPlayerName(command.player)}\n`;
                    content += `动作: ${this.getActionName(command.action)}\n`;
                    
                    if (command.playDetails) {
                        content += `牌型: ${this.getPatternName(command.playDetails.pattern)}\n`;
                        if (command.playDetails.mainCard) {
                            content += `主牌: ${command.playDetails.mainCard}\n`;
                        }
                        if (command.playDetails.attachCard) {
                            content += `带牌: ${command.playDetails.attachCard}\n`;
                        }
                        if (command.playDetails.count) {
                            content += `数量: ${command.playDetails.count}\n`;
                        }
                        if (command.playDetails.startCard) {
                            content += `起始: ${command.playDetails.startCard}\n`;
                        }
                    }
                    
                    content += `\n验证结果: ${validation.valid ? '✅ 有效' : '❌ 无效'}`;
                    if (!validation.valid) {
                        content += `\n错误原因: ${validation.reason}`;
                    }
                    
                    content += `\n时间: ${new Date().toLocaleTimeString()}`;
                } else {
                    let content = `❌ 解析失败\n\n`;
                    content += `原文: ${originalText}\n`;
                    content += `错误: 无法识别指令格式\n`;
                    content += `时间: ${new Date().toLocaleTimeString()}`;
                }
                
                element.textContent = content;
            }

            displayParseError(error, originalText) {
                const element = document.getElementById('parseResult');
                let content = `❌ 解析错误\n\n`;
                content += `原文: ${originalText}\n`;
                content += `错误: ${error.message}\n`;
                content += `时间: ${new Date().toLocaleTimeString()}`;
                element.textContent = content;
            }

            displayError(error) {
                const element = document.getElementById('voiceResult');
                let content = `❌ 语音识别错误\n\n`;
                content += `类型: ${error.type}\n`;
                content += `代码: ${error.code}\n`;
                content += `消息: ${error.message}\n`;
                content += `时间: ${new Date().toLocaleTimeString()}`;
                element.textContent = content;
            }

            displayCommandExamples() {
                const examples = this.commandParser?.getCommandExamples() || {};
                const container = document.getElementById('examples');
                
                container.innerHTML = '';
                
                for (const [category, commands] of Object.entries(examples)) {
                    const group = document.createElement('div');
                    group.className = 'example-group';
                    
                    const title = document.createElement('h4');
                    title.textContent = category;
                    group.appendChild(title);
                    
                    commands.forEach(cmd => {
                        const item = document.createElement('div');
                        item.className = 'example-item';
                        item.textContent = cmd;
                        item.style.cursor = 'pointer';
                        item.onclick = () => window.testCommand(cmd);
                        group.appendChild(item);
                    });
                    
                    container.appendChild(group);
                }
            }

            updateStatus(state, message) {
                const element = document.getElementById('status');
                element.className = `status ${state}`;
                element.textContent = message;
            }

            updateButtonStates(state) {
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');
                
                if (state === 'listening') {
                    startBtn.disabled = true;
                    startBtn.className = 'voice-button listening';
                    startBtn.textContent = '🎤 正在录音...';
                    stopBtn.disabled = false;
                } else {
                    startBtn.disabled = false;
                    startBtn.className = 'voice-button';
                    startBtn.textContent = '🎤 开始录音';
                    stopBtn.disabled = true;
                }
            }

            clearResults() {
                document.getElementById('voiceResult').textContent = '等待语音输入...';
                document.getElementById('parseResult').textContent = '等待解析结果...';
                document.getElementById('confidenceBar').style.width = '0%';
                this.updateStatus('idle', '准备就绪 - 点击开始录音进行测试');
            }

            // 工具方法
            getStateMessage(state) {
                const messages = {
                    'idle': '准备就绪 - 点击开始录音进行测试',
                    'listening': '🎤 正在监听语音输入...',
                    'processing': '🧠 正在处理识别结果...',
                    'success': '✅ 识别成功！',
                    'error': '❌ 发生错误'
                };
                return messages[state] || state;
            }

            getPlayerName(player) {
                const names = {
                    'me': '我',
                    'up': '上家',
                    'partner': '对家',
                    'down': '下家'
                };
                return names[player] || player;
            }

            getActionName(action) {
                const names = {
                    'PLAY': '出牌',
                    'PASS': '过牌',
                    'UNDO': '撤销',
                    'RESET': '重置'
                };
                return names[action] || action;
            }

            getPatternName(pattern) {
                const names = {
                    'single': '单张',
                    'pair': '对子',
                    'triple': '三张',
                    'full_house': '三带二',
                    'straight': '顺子',
                    'bomb': '炸弹',
                    'joker_bomb': '王炸'
                };
                return names[pattern] || pattern;
            }

            // 公开方法供测试按钮调用
            testCommand(text) {
                this.parseCommand(text);
                // 模拟语音识别结果
                this.displayVoiceResult({
                    text: text,
                    confidence: 0.95,
                    alternatives: []
                });
            }
        }

        // 初始化应用
        const app = new VoiceTestApp();
        
        // 将testCommand方法暴露到全局，供按钮调用
        window.testCommand = (text) => app.testCommand(text);
    </script>
</body>
</html>
